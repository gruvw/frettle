name: Test

on:
  push:
    branches-ignore: ["main"]   # (main: run by the deploy workflow, before it deploys)
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the tests
        run: node --test "test/*.test.js"
